<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLink | URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center">QuickLink</h1>
        <p class="text-gray-500 text-center mb-6 text-sm">Paikliin ang iyong mahahabang URL sa isang click.</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">I-paste ang Long URL</label>
                <input type="url" id="longUrl" placeholder="https://example.com/very-long-link" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none transition">
            </div>

            <button onclick="shortenUrl()" 
                class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition duration-300 transform active:scale-95">
                Shorten Now!
            </button>
        </div>

        <div id="resultArea" class="hidden mt-8 p-4 bg-gray-50 rounded-lg border border-dashed border-gray-300">
            <p class="text-xs text-gray-400 uppercase font-bold mb-2">Shortened Link:</p>
            <div class="flex items-center justify-between bg-white p-2 rounded border">
                <span id="shortLink" class="text-purple-600 font-medium truncate mr-2"></span>
                <button onclick="copyToClipboard()" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">Copy</button>
            </div>
        </div>
    </div>

    <script>
        async function shortenUrl() {
            const longUrl = document.getElementById('longUrl').value;
            const resultArea = document.getElementById('resultArea');
            const shortLink = document.getElementById('shortLink');

            if (!longUrl) {
                alert("Paki-lagay ang URL!");
                return;
            }

            try {
                // Ginagamit natin ang TinyURL API para sa demo (Free & No Auth)
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                const data = await response.text();

                if (data) {
                    shortLink.innerText = data;
                    resultArea.classList.remove('hidden');
                }
            } catch (error) {
                alert("Ops! May mali. Subukan muli.");
            }
        }

        function copyToClipboard() {
            const text = document.getElementById('shortLink').innerText;
            navigator.clipboard.writeText(text);
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
