<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinoy URL Shortener</title>
    <style>
        /* CSS para sa disenyo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h2 { color: #333; }

        input[type="url"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Para hindi lumampas ang input */
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover { background-color: #0056b3; }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e9f5ff;
            border-radius: 6px;
            display: none; /* Nakatago muna */
            word-break: break-all;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>URL Shortener</h2>
    <p>I-paste ang mahabang link sa ibaba:</p>
    
    <input type="url" id="longUrl" placeholder="https://example.com/very-long-link" required>
    <button onclick="shortenLink()" id="btnText">Paikliin ang Link</button>

    <div id="result">
        <p><strong>Heto na ang iyong maikling link:</strong></p>
        <a href="#" id="shortLink" target="_blank" style="color: #007bff; font-weight: bold;"></a>
    </div>
</div>

<script>
    async function shortenLink() {
        const urlInput = document.getElementById('longUrl').value;
        const resultDiv = document.getElementById('result');
        const shortLinkAnchor = document.getElementById('shortLink');
        const btn = document.getElementById('btnText');

        if (!urlInput) {
            alert("Pakilagay ang URL!");
            return;
        }

        // Loading state
        btn.innerHTML = '<span class="loader"></span> Loading...';
        btn.disabled = true;

        try {
            // Note: Dahil sa CORS policy, ang direct fetch sa browser ay minsan naba-block. 
            // Sa totoong production, gumagamit tayo ng Proxy o Backend.
            // Para sa demo na ito, gagamit tayo ng TinyURL (mas friendly sa direct browser requests)
            const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(urlInput)}`);
            
            if (response.ok) {
                const shortUrl = await response.text();
                shortLinkAnchor.href = shortUrl;
                shortLinkAnchor.innerText = shortUrl;
                resultDiv.style.display = 'block';
            } else {
                alert("Hindi ma-shorten ang link sa ngayon.");
            }
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.innerHTML = 'Paikliin ang Link';
            btn.disabled = false;
        }
    }

    export default {
  async fetch(request, env, ctx) {
    // write a key-value pair
    await env.KV.put('KEY', 'VALUE');

    // read a key-value pair
    const value = await env.KV.get('KEY');

    // list all key-value pairs
    const allKeys = await env.KV.list();

    // delete a key-value pair
    await env.KV.delete('KEY');

    // return a Workers response
    return new Response(
      JSON.stringify({
        value: value,
        allKeys: allKeys,
      }),
    );
  } 
}
</script>

</body>
</html>
